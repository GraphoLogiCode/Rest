version: 0.2
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      - docker build -f deploy/pilot/Dockerfile.managed --build-arg VITE_SUPABASE_URL="$SUPABASE_URL" --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" -t "$IMAGE_URI" .
  post_build:
    commands:
      - docker push "$IMAGE_URI"
